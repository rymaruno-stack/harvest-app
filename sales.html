<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>売上入力 | きゅうり農業管理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <h1 class="header__title">売上入力</h1>
  <div style="display:flex;gap:8px">
    <a href="index.html"     class="header__nav-btn">← 出荷入力</a>
    <a href="dashboard.html" class="header__nav-btn">ダッシュボード →</a>
  </div>
</header>

<main class="main">

  <!-- 荷受日選択 -->
  <div class="date-section">
    <label class="date-label" for="receiving-date">荷受日</label>
    <input type="date" id="receiving-date" class="date-input">
  </div>

  <!-- 出荷実績サマリー（荷受日一致レコードを自動表示） -->
  <div id="shipment-summary" class="form-section hidden">
    <h2 class="section-title" style="background:var(--green-dark)">対象出荷実績</h2>
    <div id="shipment-summary-cards" class="today-total__cards" style="margin-top:8px"></div>
  </div>

  <!-- 売上入力フォーム -->
  <form id="sales-form">

    <!-- JA 売上 -->
    <section class="form-section">
      <h2 class="section-title section-title--ja">JA 売上</h2>
      <div class="input-grid">
        <div class="input-item">
          <label class="input-label" for="ja_uriage">合計金額</label>
          <input type="number" id="ja_uriage" name="ja_uriage" class="num-input num-input--money" min="0" step="1" value="0">
        </div>
      </div>
    </section>

    <!-- 市場 売上 -->
    <section class="form-section">
      <h2 class="section-title section-title--market">市場 売上</h2>
      <div class="input-grid">
        <div class="input-item">
          <label class="input-label" for="market_uriage">合計金額</label>
          <input type="number" id="market_uriage" name="market_uriage" class="num-input num-input--money" min="0" step="1" value="0">
        </div>
      </div>
    </section>

    <!-- 市場コンテナ 売上 -->
    <section class="form-section">
      <h2 class="section-title section-title--market-container">市場コンテナ 売上</h2>
      <div class="input-grid">
        <div class="input-item">
          <label class="input-label" for="market_container_uriage">合計金額</label>
          <input type="number" id="market_container_uriage" name="market_container_uriage" class="num-input num-input--money" min="0" step="1" value="0">
        </div>
      </div>
    </section>

    <!-- JFP 売上 -->
    <section class="form-section">
      <h2 class="section-title section-title--jfp">JFP 売上</h2>
      <div class="input-grid">
        <div class="input-item">
          <label class="input-label" for="jfp_uriage">合計金額</label>
          <input type="number" id="jfp_uriage" name="jfp_uriage" class="num-input num-input--money" min="0" step="1" value="0">
        </div>
      </div>
    </section>

    <!-- 合計 -->
    <section class="form-section">
      <h2 class="section-title section-title--uriage">合計</h2>
      <div class="today-total__cards" style="margin-top:8px">
        <div class="total-card">
          <div class="total-card__house">JA</div>
          <div class="total-card__money" id="total-ja" style="font-size:1.2rem;font-weight:700">¥0</div>
        </div>
        <div class="total-card">
          <div class="total-card__house">市場</div>
          <div class="total-card__money" id="total-market" style="font-size:1.2rem;font-weight:700">¥0</div>
        </div>
        <div class="total-card">
          <div class="total-card__house">市場コンテナ</div>
          <div class="total-card__money" id="total-market-container" style="font-size:1.2rem;font-weight:700">¥0</div>
        </div>
        <div class="total-card">
          <div class="total-card__house">JFP</div>
          <div class="total-card__money" id="total-jfp" style="font-size:1.2rem;font-weight:700">¥0</div>
        </div>
        <div class="total-card" style="border-top:3px solid var(--uriage-color)">
          <div class="total-card__house">合計</div>
          <div class="total-card__money" id="total-grand" style="font-size:1.4rem;font-weight:700">¥0</div>
        </div>
      </div>
    </section>

    <!-- 保存ボタン -->
    <div class="save-area">
      <button type="submit" id="save-btn" class="save-btn">保存</button>
    </div>

  </form>

  <!-- 直近の売上履歴 -->
  <div class="history-section">
    <h2 class="history-title">直近の売上履歴</h2>
    <div id="history-cards" class="history-cards">
      <div class="loading">読み込み中...</div>
    </div>
  </div>

</main>

<!-- Toast通知 -->
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/sales.js"></script>

</body>
</html>
